name: Plugin validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-validation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hermes:
    name: Hermes portable plugin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: caafe5389ae585ef77387a962aee05b1bcf17029 # v0.23.3
          path: .validator-hermes
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Validate a source-only snapshot
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/arana-source" "$RUNNER_TEMP/hermes-home"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/arana-source"
          export HERMES_HOME="$RUNNER_TEMP/hermes-home"
          uv run --project .validator-hermes --python 3.14 --locked hermes plugins validate "$RUNNER_TEMP/arana-source" --install-deps
          uv run --project .validator-hermes --python 3.14 --locked hermes plugins doctor "$RUNNER_TEMP/arana-source" --ci

  hermes-runtime:
    name: Hermes runtime tool call
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: caafe5389ae585ef77387a962aee05b1bcf17029 # v0.23.3
          path: .validator-hermes
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the binary under test
        run: cargo build -p arana --release --locked
      - name: Install plugin and invoke a tool through Hermes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hermes-runtime-home"
          export HERMES_HOME="$RUNNER_TEMP/hermes-runtime-home"
          export PATH="$GITHUB_WORKSPACE/target/release:$PATH"
          plugin_url="file://$GITHUB_WORKSPACE"
          uv run --project .validator-hermes --python 3.14 --locked --extra mcp \
            hermes plugins install "$plugin_url" --no-enable --no-deps
          uv run --project .validator-hermes --python 3.14 --locked --extra mcp \
            hermes plugins enable arana --no-allow-tool-override
          uv run --project .validator-hermes --python 3.14 --locked --extra mcp \
            python .github/scripts/verify_hermes_runtime.py --binary-dir "$GITHUB_WORKSPACE/target/release"

  claude:
    name: Claude Code plugin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate a source-only snapshot
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/arana-source" "$RUNNER_TEMP/claude-config"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/arana-source"
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude-config"
          npx --yes --package=@anthropic-ai/claude-code@2.1.325 -- claude plugin validate --strict "$RUNNER_TEMP/arana-source"
