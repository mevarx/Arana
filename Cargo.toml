[workspace]
members = ["crates/reach-core", "crates/reach-channels", "crates/reach-browser", "crates/reach-tools", "crates/arana"]
resolver = "2"

[workspace.package]
version = "0.3.3"
edition = "2021"
license = "MIT"

[workspace.dependencies]
reach-core = { path = "crates/reach-core" }
reach-tools = { path = "crates/reach-tools" }
reach-channels = { path = "crates/reach-channels" }
reach-browser = { path = "crates/reach-browser" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "stream"] }
url = "2"
regex = "1"
fs2 = "0.4"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
which = "7"
tempfile = "3"
futures-util = "0.3"
async-trait = "0.1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
